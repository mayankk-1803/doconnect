<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="greenShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#276F27"/>
      <stop offset="100%" stop-color="#1B4D1B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ECA3C"/>
      <stop offset="100%" stop-color="#77AD2D"/>
    </linearGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#276F27" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base Shield -->
  <path d="M256 32 C340 32, 432 64, 448 80 C448 240, 416 384, 256 480 C96 384, 64 240, 64 80 C80 64, 172 32, 256 32 Z" 
        fill="url(#greenShieldGrad)" 
        filter="url(#greenGlow)" />

  <!-- Inner Highlight Accent Rim -->
  <path d="M256 48 C330 48, 416 78, 430 92 C430 236, 400 368, 256 458 C112 368, 82 236, 82 92 C96 78, 182 48, 256 48 Z" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="8" 
        stroke-opacity="0.85"/>

  <!-- Medical Protection Cross (Subtle background element in center) -->
  <path d="M236 170 H276 V226 H332 V266 H276 V322 H236 V266 H180 V226 H236 Z" 
        fill="#8ECA3C" 
        opacity="0.25" />

  <!-- Crisp White Checkmark inside Shield -->
  <g fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 256 L224 320 L352 185" />
  </g>

  <!-- Small Accent Sparkle Dot -->
  <circle cx="360" cy="140" r="12" fill="#8ECA3C" />
</svg>
